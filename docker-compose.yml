services:
  postgres:
    image: postgres:17-alpine
    container_name: quote-platform-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: quote
      POSTGRES_DB: quote_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote -d quote_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
